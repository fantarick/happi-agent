# Development/dry-run configuration. Paths are resolved relative to this file.
state_dir = ".local/state"
worktree_root = ".local/worktrees"
canonical_repo = "../../machine-audits"
jobs_dir = "jobs"
prompts_dir = "prompts"
codex_binary = "/opt/codex/0.154.0/bin/codex"
